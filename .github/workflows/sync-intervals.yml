name: Sync training plan to intervals.icu

on:
  schedule:
    # todas as segundas-feiras as 06:00 UTC (07:00/08:00 em Lisboa consoante DST)
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Correr em modo dry-run (nao escreve nada no intervals.icu nem no plano)"
        type: boolean
        default: false
      skip_adapt:
        description: "Saltar o ajuste automatico do plano e ir direto a sincronizar"
        type: boolean
        default: false
      reconcile_days:
        description: "Janela (dias) para update/delete no sync -- normalmente 21, usa um numero maior so para um refresh pontual ao plano todo"
        type: string
        default: "21"
  push:
    branches: [main]
    paths:
      - "plan/plan.json"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Adapt plan based on last week's data
        if: ${{ inputs.skip_adapt != true }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 scripts/adapt_plan.py --dry-run
          else
            python3 scripts/adapt_plan.py
          fi

      - name: Commit plan changes (if any)
        if: ${{ inputs.dry_run != true && inputs.skip_adapt != true }}
        run: |
          git config user.name "coach-bot"
          git config user.email "coach-bot@users.noreply.github.com"
          if ! git diff --quiet -- plan/plan.json plan/CHANGELOG.md; then
            git add plan/plan.json plan/CHANGELOG.md
            git commit -m "Ajuste automatico semanal do plano"
            git push
          else
            echo "Sem alteracoes ao plano esta semana."
          fi

      - name: Sync to intervals.icu
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
        run: |
          RDAYS="${{ inputs.reconcile_days }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 scripts/sync_to_intervals.py --dry-run --reconcile-days "${RDAYS:-21}"
          else
            python3 scripts/sync_to_intervals.py --reconcile-days "${RDAYS:-21}"
          fi
